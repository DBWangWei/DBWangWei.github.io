<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#667eea;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="50%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="400" fill="url(#bgGradient)"/>
  <rect width="1920" height="400" fill="url(#glowLeft)"/>
  <rect width="1920" height="400" fill="url(#glowRight)"/>

  <!-- Neural Network Nodes -->
  <g opacity="0.15" filter="url(#glow)">
    <!-- Layer 1 -->
    <circle cx="150" cy="100" r="8" fill="#667eea"/>
    <circle cx="150" cy="180" r="8" fill="#667eea"/>
    <circle cx="150" cy="260" r="8" fill="#667eea"/>
    <circle cx="150" cy="340" r="8" fill="#667eea"/>

    <!-- Layer 2 -->
    <circle cx="400" cy="80" r="6" fill="#7c6fd6"/>
    <circle cx="400" cy="160" r="6" fill="#7c6fd6"/>
    <circle cx="400" cy="240" r="6" fill="#7c6fd6"/>
    <circle cx="400" cy="320" r="6" fill="#7c6fd6"/>

    <!-- Layer 3 -->
    <circle cx="650" cy="120" r="7" fill="#8960c9"/>
    <circle cx="650" cy="200" r="7" fill="#8960c9"/>
    <circle cx="650" cy="280" r="7" fill="#8960c9"/>

    <!-- Layer 4 (right side) -->
    <circle cx="1520" cy="100" r="8" fill="#764ba2"/>
    <circle cx="1520" cy="180" r="8" fill="#764ba2"/>
    <circle cx="1520" cy="260" r="8" fill="#764ba2"/>
    <circle cx="1520" cy="340" r="8" fill="#764ba2"/>

    <circle cx="1270" cy="80" r="6" fill="#7e55ad"/>
    <circle cx="1270" cy="160" r="6" fill="#7e55ad"/>
    <circle cx="1270" cy="240" r="6" fill="#7e55ad"/>
    <circle cx="1270" cy="320" r="6" fill="#7e55ad"/>

    <circle cx="1020" cy="120" r="7" fill="#8660b8"/>
    <circle cx="1020" cy="200" r="7" fill="#8660b8"/>
    <circle cx="1020" cy="280" r="7" fill="#8660b8"/>
  </g>

  <!-- Connection Lines -->
  <g opacity="0.08" stroke="#667eea" stroke-width="1" fill="none">
    <!-- Left connections -->
    <line x1="150" y1="100" x2="400" y2="80"/>
    <line x1="150" y1="100" x2="400" y2="160"/>
    <line x1="150" y1="180" x2="400" y2="160"/>
    <line x1="150" y1="180" x2="400" y2="240"/>
    <line x1="150" y1="260" x2="400" y2="240"/>
    <line x1="150" y1="260" x2="400" y2="320"/>
    <line x1="150" y1="340" x2="400" y2="320"/>

    <line x1="400" y1="80" x2="650" y2="120"/>
    <line x1="400" y1="160" x2="650" y2="120"/>
    <line x1="400" y1="160" x2="650" y2="200"/>
    <line x1="400" y1="240" x2="650" y2="200"/>
    <line x1="400" y1="240" x2="650" y2="280"/>
    <line x1="400" y1="320" x2="650" y2="280"/>

    <!-- Right connections -->
    <line x1="1520" y1="100" x2="1270" y2="80"/>
    <line x1="1520" y1="100" x2="1270" y2="160"/>
    <line x1="1520" y1="180" x2="1270" y2="160"/>
    <line x1="1520" y1="180" x2="1270" y2="240"/>
    <line x1="1520" y1="260" x2="1270" y2="240"/>
    <line x1="1520" y1="260" x2="1270" y2="320"/>
    <line x1="1520" y1="340" x2="1270" y2="320"/>

    <line x1="1270" y1="80" x2="1020" y2="120"/>
    <line x1="1270" y1="160" x2="1020" y2="120"/>
    <line x1="1270" y1="160" x2="1020" y2="200"/>
    <line x1="1270" y1="240" x2="1020" y2="200"/>
    <line x1="1270" y1="240" x2="1020" y2="280"/>
    <line x1="1270" y1="320" x2="1020" y2="280"/>
  </g>

  <!-- Geometric Shapes -->
  <g opacity="0.06" fill="none" stroke="#667eea" stroke-width="1.5">
    <!-- Left hexagons -->
    <path d="M 300,200 L 320,180 L 360,180 L 380,200 L 360,220 L 320,220 Z"/>
    <path d="M 480,140 L 495,125 L 525,125 L 540,140 L 525,155 L 495,155 Z"/>

    <!-- Right hexagons -->
    <path d="M 1320,200 L 1340,180 L 1380,180 L 1400,200 L 1380,220 L 1340,220 Z"/>
    <path d="M 1140,260 L 1155,245 L 1185,245 L 1200,260 L 1185,275 L 1155,275 Z"/>
  </g>

  <!-- Data Points / Particles -->
  <g opacity="0.12">
    <circle cx="800" cy="100" r="2" fill="#667eea"/>
    <circle cx="850" cy="130" r="1.5" fill="#7c6fd6"/>
    <circle cx="920" cy="90" r="2.5" fill="#764ba2"/>
    <circle cx="960" cy="310" r="2" fill="#667eea"/>
    <circle cx="1100" cy="350" r="1.5" fill="#7c6fd6"/>
    <circle cx="770" cy="340" r="2" fill="#764ba2"/>
    <circle cx="560" cy="60" r="2.5" fill="#667eea"/>
    <circle cx="720" cy="50" r="1.5" fill="#7c6fd6"/>
    <circle cx="1420" cy="70" r="2" fill="#764ba2"/>
    <circle cx="240" cy="40" r="2" fill="#667eea"/>
  </g>

  <!-- Wave patterns -->
  <g opacity="0.04" fill="none" stroke="#764ba2" stroke-width="1">
    <path d="M 0,200 Q 240,180 480,200 T 960,200 T 1440,200 T 1920,200"/>
    <path d="M 0,220 Q 240,200 480,220 T 960,220 T 1440,220 T 1920,220"/>
  </g>
</svg>
